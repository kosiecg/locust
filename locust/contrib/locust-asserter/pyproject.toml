[project]
name = "locust-asserter"
version = "1.4.0"
authors = [
    { name = "Grzegorz Kosiec"}
]

description = "Library for locust framework that provides convenient assertions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "locust >= 2.34.0",
    "gevent == 24.11.1; sys_platform == 'win32'"  # Currently for Windows newer versions are not working
]

[project.urls]
"Author's Github Profile" = "https://github.com/kosiecg"

[dependency-groups]
dev = [
    "pytest >=8.3.5",
    "pytest-cov >= 6.1.0",
    "pre-commit >= 4.2.0",
    "ruff >= 0.12.10",
    "black >= 25.1.0",
    "mypy >= 1.15.0",
    "tox >= 4.25.0",
    "tox-uv>=1.25.0",
    "pylint>=3.3.7"
]

[tool.uv]
native-tls = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
line_length = 120
profile = "black"
py_version = 311

[tool.coverage.report]
precision = 2

[tool.coverage.run]
branch = true
relative_files = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 120  # 88 -> 120
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I001", "UP", "C901"]  # A few rules added. Default: ["E4", "E7", "E9", "F"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
ignore = ["UP038"]


[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
